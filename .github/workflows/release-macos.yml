name: Build and publish macOS release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'desigrit/sunno-macos' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install release verification tools
        run: python -m pip install cryptography==46.0.3
      - name: Check release configuration and updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(uname -m)" = arm64
          VERSION="$(awk -F'"' '/SUNNO_RELEASE_VERSION:/ {print $2}' project.yml)"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists. Increment project.yml before publishing."
            exit 1
          fi
          bash -n scripts/package-app.sh scripts/create-appcast.sh scripts/publish-release.sh
          python tests/test_appcast.py
          python tests/test_release_signatures.py
          python tests/test_app_updater.py
      - name: Prepare temporary signing keychain
        timeout-minutes: 3
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          test -n "$CERTIFICATE_BASE64" && test -n "$CERTIFICATE_PASSWORD"
          umask 077
          KEYCHAIN="$RUNNER_TEMP/sunno-release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/sunno-signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/sunno-signing.p12" -k "$KEYCHAIN" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          # This trust applies only to the disposable runner. Administrator trust
          # avoids the interactive authorization required by per-user trust settings.
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain config/MacReleaseSigning.pem
          IDENTITY="$(openssl x509 -in config/MacReleaseSigning.pem -noout -fingerprint -sha1 | cut -d= -f2 | tr -d ':')"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -F "$IDENTITY"
          echo "SUNNO_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "SUNNO_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/sunno-signing.p12"
      - name: Build and sign the complete app and update feed
        env:
          SUNNO_SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SUNNO_SPARKLE_PRIVATE_KEY"
          bash scripts/package-app.sh
      - name: Verify the shipped runtime and archive
        run: bash scripts/verify-packaged-app.sh
      - name: Tag and publish the verified release
        env:
          GH_TOKEN: ${{ github.token }}
          SUNNO_SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -z "$(git status --porcelain --untracked-files=normal)"
          VERSION="$(awk -F'"' '/SUNNO_RELEASE_VERSION:/ {print $2}' project.yml)"
          TAG="v$VERSION"
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" --method POST \
              -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" >/dev/null
            git tag "$TAG" "$GITHUB_SHA"
          fi
          bash scripts/publish-release.sh
          printf 'Published [Sunno %s](https://github.com/%s/releases/tag/%s).\n' \
            "$VERSION" "$GITHUB_REPOSITORY" "$TAG" >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          cat dist/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary signing credentials
        if: always()
        timeout-minutes: 1
        run: |
          # The public certificate disappears with the disposable runner. Only
          # private credentials need explicit removal here.
          security delete-keychain "$RUNNER_TEMP/sunno-release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/sunno-signing.p12"
